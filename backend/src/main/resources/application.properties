spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/repofy}
spring.datasource.username=${DB_USERNAME:repofy_user}
spring.datasource.password=${DB_PASSWORD:repofy_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Optional: explicitly set PostgreSQL dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.ai.openai.api-key=${OPENAI_API_KEY:local-development-not-configured}
spring.ai.openai.chat.model=${OPENAI_CHAT_MODEL:gpt-3.5-turbo}
spring.ai.openai.chat.max-tokens=${OPENAI_CHAT_MAX_TOKENS:2048}
spring.ai.openai.chat.temperature=${OPENAI_CHAT_TEMPERATURE:0.7}
spring.ai.openai.chat.top-p=${OPENAI_CHAT_TOP_P:1.0}
spring.ai.openai.embedding.model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
spring.ai.openai.embedding.max-tokens=${OPENAI_EMBEDDING_MAX_TOKENS:8191}
spring.ai.vectorstore.pgvector.initialize-schema=false

# Token encryption configuration
app.token-encryptor-password=${TOKEN_ENCRYPTOR_PASSWORD:}
app.token-encryptor-salt=${TOKEN_ENCRYPTOR_SALT:}

spring.security.oauth2.client.registration.github.provider=github
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:local-development-not-configured}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:local-development-not-configured}
spring.security.oauth2.client.registration.github.scope=read:user,repo

app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

spring.config.import=optional:file:.env[.properties]